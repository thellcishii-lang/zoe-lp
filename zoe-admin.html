<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘書Zoe | the.chatBOT 管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#0d0f14; --panel:#171a22; --panel-2:#1e2230; --line:#2a2f3d;
    --text:#e8eaf0; --text-dim:#8b93a6; --accent:#7c5cff; --accent-hot:#5b3ff0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; padding:20px;
  }
  .box{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:32px 26px; max-width:380px; width:100%;
  }
  .box h1{font-family:'Shippori Mincho',serif; font-size:20px; margin:0 0 6px;}
  .box .sub{font-size:13px; color:var(--text-dim); margin-bottom:22px; line-height:1.6;}
  .box input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:9px; font-size:15px; margin-bottom:12px; outline:none;
  }
  .box input:focus{border-color:var(--accent);}
  .box button{
    width:100%; background:linear-gradient(135deg, var(--accent), var(--accent-hot));
    color:#fff; border:none; border-radius:9px; padding:13px; font-weight:700; font-size:14.5px;
    cursor:pointer; touch-action:manipulation; margin-bottom:10px;
  }
  .box button:disabled{opacity:0.5;}
  .box button.ghost{background:var(--panel-2); border:1px solid var(--line); color:var(--text);}
  .msg{font-size:13px; margin-top:10px; min-height:18px;}
  .msg.error{color:#ff6b6b;}
  .msg.info{color:var(--text-dim);}
  .step{display:none;}
  .step.active{display:block;}
  #chatScreen{display:none;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="box">
    <h1>秘書Zoe</h1>
    <div class="sub">管理者パスワードでログインしてください。続けてFace ID認証が必要です。</div>

    <div class="step active" id="stepPassword">
      <input id="pwInput" type="password" placeholder="管理者パスワード">
      <button id="pwSubmitBtn">次へ</button>
      <div class="msg" id="pwMsg"></div>
    </div>

    <div class="step" id="stepFaceId">
      <button id="faceIdBtn">Face IDで認証</button>
      <button class="ghost" id="registerFaceIdBtn">この端末をFace IDとして初回登録する</button>
      <div class="msg info" id="faceIdMsg"></div>
    </div>
  </div>
</div>

<div id="chatScreen">
  <div style="max-width:720px;margin:0 auto;height:100vh;display:flex;flex-direction:column;">
    <div style="padding:14px 18px;border-bottom:1px solid var(--line);">
      <div style="font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px;">秘書Zoe</div>
    </div>
    <div id="secChatArea" style="flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;"></div>
    <div style="padding:14px 18px;border-top:1px solid var(--line);">
      <div id="secFilePreview" style="display:none;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--text-dim);margin-bottom:8px;">
        <span class="name" id="secFileName" style="color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
        <span id="secFileRemove" style="cursor:pointer;color:#ff6b6b;font-weight:700;padding:0 4px;">×</span>
      </div>
      <div style="display:flex;gap:10px;">
        <button id="secAttachBtn" title="画像・PDFを添付" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);border-radius:10px;padding:0 16px;font-size:18px;cursor:pointer;flex-shrink:0;">📎</button>
        <input type="file" id="secFileInput" accept=".pdf,image/*" style="display:none;">
        <textarea id="secInput" rows="1" placeholder="秘書Zoeにメッセージ..." style="flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font-family:'Inter',sans-serif;font-size:14.5px;outline:none;resize:none;"></textarea>
        <button id="secSendBtn" style="background:linear-gradient(135deg, var(--accent), var(--accent-hot));color:#fff;border:none;border-radius:10px;padding:0 20px;font-weight:700;font-size:14px;cursor:pointer;">送信</button>
      </div>
    </div>
  </div>
</div>

<script>
const ADMIN_LOGIN_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/admin-login";
const REG_START_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/admin-webauthn-register-start";
const REG_VERIFY_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/admin-webauthn-register-verify";
const AUTH_START_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/admin-webauthn-auth-start";
const AUTH_VERIFY_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/admin-webauthn-auth-verify";

let enteredPassword = null;

// --- base64url <-> ArrayBuffer 変換ヘルパー(ライブラリを使わず標準APIだけで完結させる) ---
function base64urlToBuffer(base64url, fieldNameForDebug){
  try{
    const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
    const base64 = (base64url + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const buffer = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) buffer[i] = raw.charCodeAt(i);
    return buffer.buffer;
  }catch(e){
    throw new Error(`base64urlデコード失敗(項目:${fieldNameForDebug}, 値:"${base64url}", 型:${typeof base64url})`);
  }
}
function bufferToBase64url(buffer){
  const bytes = new Uint8Array(buffer);
  let str = '';
  for (const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function showStep(id){
  document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('pwSubmitBtn').addEventListener('click', async () => {
  const password = document.getElementById('pwInput').value;
  const msgEl = document.getElementById('pwMsg');
  msgEl.textContent = '';
  msgEl.className = 'msg';
  if(!password){ msgEl.textContent = 'パスワードを入力してください'; msgEl.className='msg error'; return; }

  try{
    const res = await fetch(ADMIN_LOGIN_ENDPOINT, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if(!res.ok){ msgEl.textContent = data.error || 'ログインに失敗しました'; msgEl.className='msg error'; return; }
    enteredPassword = password;
    showStep('stepFaceId');
  }catch(e){
    msgEl.textContent = '通信エラーが発生しました';
    msgEl.className = 'msg error';
  }
});

document.getElementById('faceIdBtn').addEventListener('click', async () => {
  const msgEl = document.getElementById('faceIdMsg');
  msgEl.textContent = 'Face IDで認証中...';
  msgEl.className = 'msg info';
  try{
    const startRes = await fetch(AUTH_START_ENDPOINT, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: enteredPassword })
    });
    const options = await startRes.json();
    if(!startRes.ok){ msgEl.textContent = options.error || '開始に失敗しました'; msgEl.className='msg error'; return; }

    const publicKey = {
      challenge: base64urlToBuffer(options.challenge, 'auth.challenge'),
      rpId: options.rpId,
      allowCredentials: (options.allowCredentials || []).map(c => ({
        id: base64urlToBuffer(c.id, 'allowCredentials.id'),
        type: 'public-key',
        transports: c.transports,
      })),
      userVerification: options.userVerification || 'required',
      timeout: options.timeout,
    };

    const assertion = await navigator.credentials.get({ publicKey });

    const response = {
      id: assertion.id,
      rawId: bufferToBase64url(assertion.rawId),
      type: assertion.type,
      response: {
        clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
        authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
        signature: bufferToBase64url(assertion.response.signature),
        userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null,
      },
      clientExtensionResults: assertion.getClientExtensionResults ? assertion.getClientExtensionResults() : {},
    };

    const verifyRes = await fetch(AUTH_VERIFY_ENDPOINT, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ response })
    });
    const verifyData = await verifyRes.json();
    if(!verifyRes.ok || !verifyData.verified){ msgEl.textContent = verifyData.error || '認証に失敗しました'; msgEl.className='msg error'; return; }

    sessionStorage.setItem('adminSessionToken', verifyData.sessionToken);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'block';
  }catch(e){
    msgEl.textContent = 'Face ID認証中にエラーが発生しました: ' + e.message;
    msgEl.className = 'msg error';
  }
});

document.getElementById('registerFaceIdBtn').addEventListener('click', async () => {
  const msgEl = document.getElementById('faceIdMsg');
  msgEl.textContent = 'この端末をFace IDとして登録します...';
  msgEl.className = 'msg info';
  try{
    const startRes = await fetch(REG_START_ENDPOINT, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: enteredPassword })
    });
    const options = await startRes.json();
    if(!startRes.ok){ msgEl.textContent = options.error || '開始に失敗しました'; msgEl.className='msg error'; return; }

    const publicKey = {
      challenge: base64urlToBuffer(options.challenge, 'challenge'),
      rp: options.rp,
      user: {
        id: base64urlToBuffer(options.user.id, 'user.id'),
        name: options.user.name,
        displayName: options.user.displayName,
      },
      pubKeyCredParams: options.pubKeyCredParams,
      authenticatorSelection: options.authenticatorSelection,
      attestation: options.attestation || 'none',
      timeout: options.timeout,
    };

    const credential = await navigator.credentials.create({ publicKey });

    const response = {
      id: credential.id,
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
        attestationObject: bufferToBase64url(credential.response.attestationObject),
        transports: credential.response.getTransports ? credential.response.getTransports() : [],
      },
      clientExtensionResults: credential.getClientExtensionResults ? credential.getClientExtensionResults() : {},
    };

    const verifyRes = await fetch(REG_VERIFY_ENDPOINT, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: enteredPassword, response })
    });
    const verifyData = await verifyRes.json();
    if(!verifyRes.ok || !verifyData.verified){ msgEl.textContent = verifyData.error || '登録に失敗しました'; msgEl.className='msg error'; return; }

    msgEl.textContent = '登録できました。続けて「Face IDで認証」を押してください。';
    msgEl.className = 'msg info';
  }catch(e){
    msgEl.textContent = '登録中にエラーが発生しました: ' + e.message;
    msgEl.className = 'msg error';
  }
});

// --- 秘書Zoeとのチャット ---
const SECRETARY_CHAT_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/chat";
let secretaryConversation = [];

// 簡易Markdownレンダリング(太字・表・箇条書きだけ対応。それ以外は元のテキストのまま)
function renderSecMarkdown(text){
  // まずHTMLとして解釈されないよう安全にエスケープする
  const escape = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = escape(text).split('\n');
  let html = '';
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    // 表(| ... | ... |の並び)
    if(/^\s*\|.*\|\s*$/.test(line) && lines[i+1] && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])){
      let tableLines = [line];
      let j = i + 2;
      while(j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])){ tableLines.push(lines[j]); j++; }
      const header = tableLines[0].split('|').map(s=>s.trim()).filter(Boolean);
      const rows = tableLines.slice(1).map(l => l.split('|').map(s=>s.trim()).filter(Boolean));
      html += '<table style="border-collapse:collapse;width:100%;margin:6px 0;font-size:13px;">';
      html += '<tr>' + header.map(h=>`<th style="border:1px solid var(--line);padding:6px 8px;text-align:left;background:var(--panel-2);">${h}</th>`).join('') + '</tr>';
      rows.forEach(r => {
        html += '<tr>' + r.map(c=>`<td style="border:1px solid var(--line);padding:6px 8px;">${c}</td>`).join('') + '</tr>';
      });
      html += '</table>';
      i = j;
      continue;
    }
    // 箇条書き
    if(/^\s*[-・]\s+/.test(line)){
      let listLines = [];
      let j = i;
      while(j < lines.length && /^\s*[-・]\s+/.test(lines[j])){ listLines.push(lines[j].replace(/^\s*[-・]\s+/, '')); j++; }
      html += '<ul style="margin:4px 0;padding-left:20px;">' + listLines.map(l=>`<li>${l}</li>`).join('') + '</ul>';
      i = j;
      continue;
    }
    // 太字 **text**
    const bolded = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html += (bolded || '&nbsp;') + '<br>';
    i++;
  }
  return html;
}

function addSecMessage(role, text){
  const div = document.createElement('div');
  div.style.cssText = role === 'user'
    ? 'align-self:flex-end;max-width:82%;background:rgba(124,92,255,0.14);border:1px solid var(--accent);border-radius:14px;border-bottom-right-radius:4px;padding:11px 14px;font-size:14px;'
    : 'align-self:flex-start;max-width:88%;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px;padding:11px 14px;font-size:14px;';
  if(role === 'user'){
    div.style.whiteSpace = 'pre-wrap';
    div.textContent = text;
  } else {
    div.innerHTML = renderSecMarkdown(text);
  }
  const area = document.getElementById('secChatArea');
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

// --- ファイル添付(画像・PDF) ---
let secAttachedFile = null; // { name, mediaType, base64, kind: 'image'|'document' }

document.getElementById('secAttachBtn').addEventListener('click', () => {
  document.getElementById('secFileInput').click();
});
document.getElementById('secFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const isPdf = file.type === 'application/pdf';
  const isImage = file.type.startsWith('image/');
  if(!isPdf && !isImage){ alert('画像またはPDFファイルを選択してください'); return; }
  if(file.size > 10 * 1024 * 1024){ alert('ファイルサイズが大きすぎます(10MBまで)'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(',')[1];
    secAttachedFile = { name: file.name, mediaType: file.type, base64, kind: isPdf ? 'document' : 'image' };
    document.getElementById('secFileName').textContent = file.name;
    document.getElementById('secFilePreview').style.display = 'flex';
  };
  reader.readAsDataURL(file);
});
document.getElementById('secFileRemove').addEventListener('click', () => {
  secAttachedFile = null;
  document.getElementById('secFilePreview').style.display = 'none';
  document.getElementById('secFileInput').value = '';
});

async function sendSecretaryMessage(){
  const input = document.getElementById('secInput');
  const text = input.value.trim();
  if(!text && !secAttachedFile) return;
  const sendBtn = document.getElementById('secSendBtn');
  sendBtn.disabled = true;
  input.value = '';

  addSecMessage('user', text || (secAttachedFile ? `📎 ${secAttachedFile.name}` : ''));

  if(secAttachedFile){
    const contentBlocks = [
      { type: secAttachedFile.kind, source: { type: 'base64', media_type: secAttachedFile.mediaType, data: secAttachedFile.base64 } },
      { type: 'text', text: text || 'この内容を確認してください。' }
    ];
    secretaryConversation.push({ role: 'user', content: contentBlocks });
    secAttachedFile = null;
    document.getElementById('secFilePreview').style.display = 'none';
    document.getElementById('secFileInput').value = '';
  } else {
    secretaryConversation.push({ role: 'user', content: text });
  }

  try{
    const sessionToken = sessionStorage.getItem('adminSessionToken');
    const res = await fetch(SECRETARY_CHAT_ENDPOINT, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ mode: 'secretary', sessionToken, messages: secretaryConversation })
    });
    const data = await res.json();
    if(!res.ok){
      addSecMessage('bot', 'エラー: ' + (data.error || '不明なエラー'));
      sendBtn.disabled = false;
      return;
    }
    addSecMessage('bot', data.reply);
    if(Array.isArray(data.images) && data.images.length > 0){
      const area = document.getElementById('secChatArea');
      data.images.forEach(img => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'align-self:flex-start;max-width:88%;';
        const el = document.createElement('img');
        el.src = `data:${img.mediaType};base64,${img.data}`;
        el.style.cssText = 'max-width:100%;border-radius:10px;border:1px solid var(--line);';
        wrap.appendChild(el);
        area.appendChild(wrap);
      });
      area.scrollTop = area.scrollHeight;
    }
    secretaryConversation.push({ role: 'assistant', content: data.reply });
  }catch(e){
    addSecMessage('bot', '通信エラーが発生しました: ' + e.message);
  }
  sendBtn.disabled = false;

}

document.getElementById('secSendBtn').addEventListener('click', sendSecretaryMessage);
const isTouchDeviceSec = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
document.getElementById('secInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    if(isTouchDeviceSec){
      return; // スマホ等では、Enterは改行のみ。送信は送信ボタンで行う
    }
    e.preventDefault();
    sendSecretaryMessage();
  }
});
</script>
</body>
</html>
