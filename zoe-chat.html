<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe と話す | the.chatBOT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#14120f;
    --panel:#1c1a15;
    --panel-2:#221f19;
    --line:#33301f;
    --text:#e9e4d8;
    --text-dim:#948d78;
    --amber:#ff9524;
    --amber-hot:#ff5c05;
    --amber-dim:rgba(255,149,36,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,92,5,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .avatar{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg, var(--amber), var(--amber-hot));
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-weight:700;color:#1a0f00;font-size:16px;
    flex-shrink:0;
  }
  .header-text .name{font-weight:700;font-size:14.5px;font-family:'Shippori Mincho',serif;}
  .header-text .status{font-size:11.5px;color:var(--text-dim);}
  .status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7fbf6a;margin-right:5px;}

  #chatArea{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:720px;
    width:100%;
    margin:0 auto;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:14px;
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
  }
  .msg.bot{
    background:var(--panel);
    border:1px solid var(--line);
    align-self:flex-start;
    border-bottom-left-radius:4px;
  }
  .msg.user{
    background:linear-gradient(135deg, var(--amber-dim), rgba(255,92,5,0.18));
    border:1px solid var(--amber);
    color:var(--text);
    align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  .msg.typing{
    background:var(--panel);
    border:1px solid var(--line);
    align-self:flex-start;
    border-bottom-left-radius:4px;
    display:flex;
    gap:4px;
    padding:14px 16px;
  }
  .typing .d{
    width:6px;height:6px;border-radius:50%;background:var(--text-dim);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing .d:nth-child(2){animation-delay:0.15s;}
  .typing .d:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}

  .quick-replies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 18px 14px;
    max-width:720px;
    width:100%;
    margin:0 auto;
    flex-shrink:0;
  }
  .quick-reply{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .quick-reply:active{border-color:var(--amber);color:var(--amber);}

  #inputArea{
    display:flex;
    gap:10px;
    padding:14px 18px;
    border-top:1px solid var(--line);
    flex-shrink:0;
    background:var(--bg);
    max-width:720px;
    width:100%;
    margin:0 auto;
    box-sizing:border-box;
  }
  #userInput{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    outline:none;
    resize:none;
  }
  #userInput:focus{border-color:var(--amber);}
  #sendBtn{
    background:linear-gradient(135deg, var(--amber), var(--amber-hot));
    color:#1a0f00;
    border:none;
    border-radius:10px;
    padding:0 20px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    touch-action:manipulation;
    flex-shrink:0;
  }
  #sendBtn:disabled{opacity:0.5;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<header>
  <div class="avatar">Z</div>
  <div class="header-text">
    <div class="name">Zoe</div>
    <div class="status"><span class="dot"></span>オンライン</div>
  </div>
</header>

<div id="chatArea"></div>
<div class="quick-replies" id="quickReplies"></div>

<div id="inputArea">
  <textarea id="userInput" rows="1" placeholder="メッセージを入力..."></textarea>
  <button id="sendBtn">送信</button>
</div>

<script>
let conversationHistory = [];
let isWaitingForResponse = false;

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const quickRepliesEl = document.getElementById('quickReplies');

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="d"></div><div class="d"></div><div class="d"></div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

function setQuickReplies(options){
  quickRepliesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      quickRepliesEl.innerHTML = '';
      sendMessage(opt);
    });
    quickRepliesEl.appendChild(btn);
  });
}

async function verifyUrlTool(input){
  try{
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/verify-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: input.url, customerName: input.customerName })
    });
    const data = await res.json();
    if(!data.exists){
      return "そのURLは確認できませんでした。もう一度URLを伺う必要があります。";
    }
    if(data.nameMatch === true){
      return "URLの実在、および会社名との一致を確認できました。";
    }
    if(data.nameMatch === false){
      return "URLの実在は確認できましたが、ページ内に会社名が見当たりませんでした。お客様に、このURLで間違いないか一言確認してください。";
    }
    return "URLの実在は確認できました。";
  }catch(e){
    return "URL確認中にエラーが発生しました: " + e.message;
  }
}

async function checkLeadEmailTool(input){
  try{
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/customer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'findByEmail', email: input.email })
    });
    const data = await res.json();
    if(res.ok && data.id){
      return `既存の記録が見つかりました。登録されている会社名: 「${data.customerName}」`;
    }
    return "このメールアドレスの記録は見つかりませんでした(新規です)。";
  }catch(e){
    return "確認中にエラーが発生しました: " + e.message;
  }
}

async function upsertLeadTool(input){
  try{
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/customer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'upsertLead', ...input })
    });
    const data = await res.json();
    if(res.ok && data.id){
      return data.updated ? "既存の記録を更新しました。" : "新しい記録として保存しました。";
    }
    return "保存に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "保存中にエラーが発生しました: " + e.message;
  }
}

function downloadDocxFile(base64, filename){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  const byteArray = new Uint8Array(byteNumbers);
  const blob = new Blob([byteArray], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  const url = URL.createObjectURL(blob);

  const wrap = document.createElement('div');
  wrap.style.marginTop = '8px';
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.textContent = '📄 ' + filename + '(クリックしてダウンロード)';
  link.style.color = 'var(--amber)';
  wrap.appendChild(link);
  return wrap;
}

async function generateApplicationTool(input){
  try{
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/generate-application", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(input)
    });
    const data = await res.json();
    if(res.ok && data.fileBase64){
      lastApplicationFile = { base64: data.fileBase64, filename: data.filename };

      try{
        const imageDataUrl = await renderApplicationPreviewImage(input);
        lastApplicationPreviewImage = imageDataUrl.split(',')[1]; // base64部分のみ保持

        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin-top:8px;';
        const img = document.createElement('img');
        img.src = imageDataUrl;
        img.style.cssText = 'max-width:100%;border-radius:8px;border:1px solid #444;cursor:pointer;display:block;';
        img.addEventListener('click', () => window.open(imageDataUrl, '_blank'));
        wrap.appendChild(img);
        wrap.appendChild(downloadDocxFile(data.fileBase64, data.filename));
        chatArea.appendChild(wrap);
        chatArea.scrollTop = chatArea.scrollHeight;
      }catch(e){
        // 画像生成に失敗しても、ダウンロードリンクだけは出す
        const wrap = document.createElement('div');
        wrap.style.marginTop = '8px';
        wrap.appendChild(downloadDocxFile(data.fileBase64, data.filename));
        chatArea.appendChild(wrap);
        chatArea.scrollTop = chatArea.scrollHeight;
      }

      return "申込書を生成し、チャット内に画像プレビューとダウンロードリンクを表示しました。";
    }
    return "申込書の生成に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "申込書の生成中にエラーが発生しました: " + e.message;
  }
}

async function createCustomerTool(input){
  try{
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/customer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: 'create',
        customerName: input.customerName,
        contactPerson: input.contactPerson,
        address: input.address,
        email: input.email,
        companyUrl: input.companyUrl
      })
    });
    const data = await res.json();
    if(res.ok && data.id){
      // 直近で生成した申込書(ファイル・プレビュー画像)を、新しく発行したIDのレコードに紐づけて保存する。
      // これにより、後で黄色い申込み画面(zoe-setup.html)を開いた時に、全く同じものを表示できる。
      if(lastApplicationFile || lastApplicationPreviewImage){
        await fetch("https://thechatbot-proxy.vercel.app/api/customer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: 'update',
            id: data.id,
            password: data.password,
            updates: {
              applicationFileBase64: lastApplicationFile ? lastApplicationFile.base64 : null,
              applicationFileName: lastApplicationFile ? lastApplicationFile.filename : null,
              applicationImageBase64: lastApplicationPreviewImage || null
            }
          })
        }).catch(() => {});
      }
      return `発行成功。ID: ${data.id} / パスワード: ${data.password} / 本申込み用リンク: https://the-chatbot.com/zoe-application.html`;
    }
    return "発行に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "発行中にエラーが発生しました: " + e.message;
  }
}

async function sendEmailTool(input){
  try{
    const body = { ...input };
    // 直近で申込書を生成済みなら、そのファイルをメールに自動添付する
    if(lastApplicationFile){
      body.attachments = [{ filename: lastApplicationFile.filename, content: lastApplicationFile.base64 }];
    }
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/send-email", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(res.ok && data.success){
      return "送信成功しました。";
    }
    return "送信に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "送信中にエラーが発生しました: " + e.message;
  }
}

async function callZoe(messages){
  let currentMessages = messages.slice();

  while(true){
    const response = await fetch("https://thechatbot-proxy.vercel.app/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "zoe-chat",
        adminPassword: sessionAdminPassword || new URLSearchParams(window.location.search).get('admin') || null,
        messages: currentMessages
      })
    });
    const data = await response.json();

    const toolUseBlock = data.content.find(b => b.type === 'tool_use');
    if(toolUseBlock){
      let toolResultText;
      if(toolUseBlock.name === 'create_customer'){
        toolResultText = await createCustomerTool(toolUseBlock.input);
      } else if(toolUseBlock.name === 'generate_application'){
        toolResultText = await generateApplicationTool(toolUseBlock.input);
      } else if(toolUseBlock.name === 'send_brochure'){
        toolResultText = await sendBrochureTool();
      } else if(toolUseBlock.name === 'verify_url'){
        toolResultText = await verifyUrlTool(toolUseBlock.input);
      } else if(toolUseBlock.name === 'check_lead_email'){
        toolResultText = await checkLeadEmailTool(toolUseBlock.input);
      } else if(toolUseBlock.name === 'upsert_lead'){
        toolResultText = await upsertLeadTool(toolUseBlock.input);
      } else {
        toolResultText = await sendEmailTool(toolUseBlock.input);
      }
      currentMessages = currentMessages.concat([
        { role: 'assistant', content: data.content },
        { role: 'user', content: [{ type: 'tool_result', tool_use_id: toolUseBlock.id, content: toolResultText }] }
      ]);
      continue; // もう一度Zoeに問い合わせて、最終的な返信テキストを得る
    }

    const textBlock = data.content.find(b => b.type === 'text');
    return { text: textBlock ? textBlock.text : '(応答の取得に失敗しました)', finalMessages: currentMessages };
  }
}

let sessionAdminPassword = null; // 入力されたadminパスワード(一致すればサーバー側でブラックリスト対象外になる)
let awaitingAdminPassword = false; // 「admin」と入力された直後、次の入力をパスワードとして扱うフラグ

async function sendMessage(text){
  if(!text || isWaitingForResponse) return;

  // 「admin」関連の入力は、Zoeに送らずこの画面だけで完結させる
  if(awaitingAdminPassword){
    sessionAdminPassword = text.trim();
    awaitingAdminPassword = false;
    addMessage('user', text);
    addMessage('bot', '承知しました。');
    userInput.value = '';
    autoResize();
    return;
  }
  if(/^admin/i.test(text.trim())){
    addMessage('user', text);
    addMessage('bot', 'パスワードを入力してください。');
    awaitingAdminPassword = true;
    userInput.value = '';
    autoResize();
    return;
  }

  isWaitingForResponse = true;
  sendBtn.disabled = true;
  quickRepliesEl.innerHTML = '';

  addMessage('user', text);
  conversationHistory.push({role:'user', content: text});
  userInput.value = '';
  autoResize();

  showTyping();
  try{
    const result = await callZoe(conversationHistory);
    hideTyping();
    addMessage('bot', result.text);
    conversationHistory = result.finalMessages.concat([{role:'assistant', content: result.text}]);
  }catch(e){
    hideTyping();
    addMessage('bot', 'すみません、通信エラーが発生しました。もう一度お試しいただくか、フォームからお問い合わせください。');
  }
  isWaitingForResponse = false;
  sendBtn.disabled = false;
}

function autoResize(){
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
}

userInput.addEventListener('input', autoResize);
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
userInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    if(e.isComposing || e.keyCode === 229){
      return; // IME変換確定のEnterは送信扱いにしない
    }
    if(isTouchDevice){
      return; // スマホ等では、Enterは改行のみ。送信は送信ボタンで行う
    }
    e.preventDefault();
    sendMessage(userInput.value.trim());
  }
});
sendBtn.addEventListener('click', () => sendMessage(userInput.value.trim()));

// URLパラメータ(会社名・担当者名・業種・メール・相談内容)を読み取り、入力があればZoeの最初の挨拶に活かす
const urlParams = new URLSearchParams(window.location.search);
const prefillCompany = urlParams.get('company');
const prefillPerson = urlParams.get('person');
const prefillIndustry = urlParams.get('industry');
const prefillEmail = urlParams.get('email');
const prefillMsg = urlParams.get('msg');

async function lookupRecall(company, person){
  try{
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/recall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'lookup', company, person })
    });
    const data = await res.json();
    return data.found ? data.record : null;
  }catch(e){
    return null; // 失敗しても通常の初回フローに落とすだけなので握りつぶす
  }
}

async function saveRecall(company, person, firstTopic){
  try{
    await fetch("https://thechatbot-proxy.vercel.app/api/recall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'save', company, person, firstTopic })
    });
  }catch(e){
    // 保存に失敗しても会話自体は継続させる
  }
}

// 事前情報を踏まえたcontextLineを組み立てる(通常の初回向け、または再訪問向けで内容を変える)
function buildContextLine(pastRecord){
  if(pastRecord){
    // 再訪問:以前の最初の相談内容を絡めて、感謝+本人確認を兼ねた挨拶にする
    let line = `事前情報 — 会社名: ${prefillCompany}　ご担当者様名: ${prefillPerson}`;
    if(prefillIndustry) line += `　業種: ${prefillIndustry}`;
    if(prefillEmail) line += `　連絡先: ${prefillEmail}`;
    if(prefillMsg) line += `　今回のご相談内容: ${prefillMsg}`;
    line += `\n\nこの方は以前にもお問い合わせいただいたことがあり、前回最初にご相談いただいた件は「${pastRecord.firstTopic}」でした。`;
    line += `\n\n上記を踏まえて、「(会社名)の(お名前)様、いつもご連絡ありがとうございます。本日は、どうされましたか?前回お問い合わせ頂きましたのは、(前回の件)でしたよね?」という形式で、感謝の挨拶と前回内容の確認を続けて自然に述べてください。`;
    return line;
  }
  let contextLine = '事前情報 — ';
  if(prefillCompany) contextLine += `会社名: ${prefillCompany}　`;
  if(prefillPerson) contextLine += `ご担当者様名: ${prefillPerson}　`;
  if(prefillIndustry) contextLine += `業種: ${prefillIndustry}　`;
  if(prefillEmail) contextLine += `連絡先: ${prefillEmail}　`;
  if(prefillMsg) contextLine += `相談内容: ${prefillMsg}`;
  contextLine += '\n\n上記の情報を踏まえて、挨拶と最初の質問をしてください。会社名とご担当者様名が分かる場合は「(会社名)の(お名前)様」のように呼びかけてください。';
  return contextLine;
}

// アクセス統計:このチャット画面が開かれるたびに1回記録する(失敗しても会話には影響させない)
fetch("https://thechatbot-proxy.vercel.app/api/track-event", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ type: "chat_start", botId: "Zoe001" })
}).catch(() => {});

// Opening message
(async () => {
  const hasPrefill = prefillCompany || prefillPerson || prefillIndustry || prefillEmail || prefillMsg;
  let pastRecord = null;

  // 会社名+お名前の両方が揃っている場合のみ、過去の会話を照会する(名前だけの人は記憶対象外)
  if(prefillCompany && prefillPerson){
    pastRecord = await lookupRecall(prefillCompany, prefillPerson);
    // 初めての組み合わせなら、今回の相談内容を「最初の件」として新規保存しておく
    if(!pastRecord){
      saveRecall(prefillCompany, prefillPerson, prefillMsg || prefillIndustry || 'ご相談');
    }
  }

  if(hasPrefill){
    conversationHistory.push({role:'user', content: buildContextLine(pastRecord)});
    showTyping();
    try{
      const result = await callZoe(conversationHistory);
      hideTyping();
      addMessage('bot', result.text);
      conversationHistory = result.finalMessages.concat([{role:'assistant', content: result.text}]);
    }catch(e){
      hideTyping();
      addMessage('bot', '申し訳ございません。途切れてしましました。');
    }
  } else {
    addMessage('bot', 'この度は、the.chatBOT Zoeにお問い合わせ頂き誠に有難うございます。\nわたくしZoe(ゾーイ)がご質問を受け賜わらせて頂きます。どうぞよろしくお願い申し上げます。\nこの度のお問い合わせは導入をご検討されているということでよろしいでしょうか？');
  }
})();
</script>
