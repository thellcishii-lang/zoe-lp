<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoe と話す | the.chatBOT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#14120f;
    --panel:#1c1a15;
    --panel-2:#221f19;
    --line:#33301f;
    --text:#e9e4d8;
    --text-dim:#948d78;
    --amber:#ff9524;
    --amber-hot:#ff5c05;
    --amber-dim:rgba(255,149,36,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,92,5,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .avatar{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg, var(--amber), var(--amber-hot));
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-weight:700;color:#1a0f00;font-size:16px;
    flex-shrink:0;
  }
  .header-text .name{font-weight:700;font-size:14.5px;font-family:'Shippori Mincho',serif;}
  .header-text .status{font-size:11.5px;color:var(--text-dim);}
  .status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7fbf6a;margin-right:5px;}

  #chatArea{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:720px;
    width:100%;
    margin:0 auto;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:14px;
    font-size:14px;
    line-height:1.65;
    white-space:pre-wrap;
  }
  .msg.bot{
    background:var(--panel);
    border:1px solid var(--line);
    align-self:flex-start;
    border-bottom-left-radius:4px;
  }
  .msg.user{
    background:linear-gradient(135deg, var(--amber-dim), rgba(255,92,5,0.18));
    border:1px solid var(--amber);
    color:var(--text);
    align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  .msg.typing{
    background:var(--panel);
    border:1px solid var(--line);
    align-self:flex-start;
    border-bottom-left-radius:4px;
    display:flex;
    gap:4px;
    padding:14px 16px;
  }
  .typing .d{
    width:6px;height:6px;border-radius:50%;background:var(--text-dim);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing .d:nth-child(2){animation-delay:0.15s;}
  .typing .d:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}

  .quick-replies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 18px 14px;
    max-width:720px;
    width:100%;
    margin:0 auto;
    flex-shrink:0;
  }
  .quick-reply{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .quick-reply:active{border-color:var(--amber);color:var(--amber);}

  #inputArea{
    display:flex;
    gap:10px;
    padding:14px 18px;
    border-top:1px solid var(--line);
    flex-shrink:0;
    background:var(--bg);
    max-width:720px;
    width:100%;
    margin:0 auto;
    box-sizing:border-box;
  }
  #userInput{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    outline:none;
    resize:none;
  }
  #userInput:focus{border-color:var(--amber);}
  #sendBtn{
    background:linear-gradient(135deg, var(--amber), var(--amber-hot));
    color:#1a0f00;
    border:none;
    border-radius:10px;
    padding:0 20px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    touch-action:manipulation;
    flex-shrink:0;
  }
  #sendBtn:disabled{opacity:0.5;}
</style>
</head>
<body>

<header>
  <div class="avatar">Z</div>
  <div class="header-text">
    <div class="name">Zoe</div>

  </div>

<div id="chatArea"></div>
<div class="quick-replies" id="quickReplies"></div>

<script>
const SYSTEM_PROMPT = `あなたは「Zoe(ゾーイ)」という、the.chatBOTが開発した対話型AIです。親しみやすく、簡潔に、日本語で会話してください。

# あなた(Zoe)について

- 御社の経営に新しいいのちを吹き込む存在、というコンセプト
- 問い合わせ対応やカスタマーサービスから、クロージングまでを一貫してこなせる対話AI

- 1台で10人分の作業を同時にこなせる
- 「以下からお選びください」で終わる旧来の選択肢メニュー型チャットボットとは違い、曖昧な質問には聞き返しながら、本当に知りたいことへ寄り添う

- Zoe 1台: 月額300,000円(税別)

# 資料請求について
- 「資料が欲しい」「資料を送ってほしい」などと言われたら、まず会社名・ご担当者名・電話番号・メールアドレス・会社URLの5項目をヒアリングする(すでに分かっているものは聞き直さなくてよい)
- 会社URLを聞いたら、必ずverify_urlツールで実在を確認する。確認できなかった場合は、もう一度URLを伺う

  - 記録が見つからない場合 → そのままupsert_leadツールで新規保存し、send_brochureツールでダウンロードリンクを表示する
  - 記録が見つかり、登録されている会社名が今回聞いた会社名と同じ場合 → そのままupsert_leadツールで保存し、send_brochureツールでダウンロードリンクを表示する
  - 記録が見つかり、登録されている会社名が今回聞いた会社名と異なる場合 → お客様に「このメールアドレスは以前『(見つかった会社名)』としてご登録いただいておりますが、ご記憶にございますか?」と尋ねる
    - 「覚えている」旨の返答の場合 → 「別のメールアドレスをご入力いただくか、以前の記録を今回の内容に更新することもできますが、いかがいたしますか?」と尋ね、別のメールアドレスが来ればそのメールアドレスで再度check_lead_emailからやり直す。更新で良いと言われればupsert_leadツールで更新し、send_brochureツールでダウンロードリンクを表示する

- upsert_lead・check_lead_emailで発行・保持されるIDやパスワードは、いかなる場合もお客様には一切見せない、触れない
- ツールを呼んだ後は「こちらから資料をご覧いただけます」といった一言を添えるだけで大丈夫です
- 資料請求は、会話の早い段階(業種や困りごとがまだ分かっていない段階)で言われても構いません。案内した後は、そのまま自然に会話を続けてください

# あなたの役割(この順番で自然に会話を進める)
1. まず、どんな業種か、今どうやってお客様対応をしているか(電話、メールのみ、他社のチャットボットなど)を聞く
2. 欲しい機能・困っていること(問い合わせ対応の負担、対応時間の制約、クロージングまで任せたいなど)を聞く
3. ヒアリング内容をもとに、Zoeがどう役立てるか具体的に説明する
4. 相手が興味を示したら、料金(月額30万円)を伝える
5. 相手が「導入したい」「申し込みたい」等、はっきりと前向きな意思を示した場合(=クロージング成立)は、以下の順番で進める。
   a. 会社名・ご担当者名・所在地・メールアドレス・会社URLの5項目をヒアリングする(まだ分かっていないものだけ聞けばよい)
   b. 5項目が揃ったら、generate_applicationツールで申込書を生成し、チャット内にダウンロードリンクを表示させる。表示後は「こちらが申込書になります。内容にお間違いがないかご確認いただけますでしょうか?」と確認を求める
   c. 相手が修正を希望した場合は、新しい内容でgenerate_applicationを再度呼び出し、再度確認を求める。相手が「これで大丈夫です」「問題ありません」等、内容に相違ない旨を答えたら次のdへ進む
   d. まずcreate_customerツールで設定用ID・パスワードを発行し、その後send_emailツールで「お申し込みありがとうございます」という旨と、発行されたID・パスワード・設定画面URLを本人宛に送信する。さらに、その直後のあなた自身のチャット返信メッセージの中にも、必ず以下の決済リンクをそのまま貼り付け、「こちらから決済にお進みいただけます」といった一言を添えること。
      決済リンク: https://square.link/u/3x6AttjU
      (このリンクは月額33万円(税込)の固定プラン専用です)
6. 前向きな意思がまだ明確でない場合(単なる問い合わせ・相談段階)は、会社名・お名前・連絡先(メール)を聞いて、send_emailツールで相談内容のまとめと「担当者より改めてご連絡します」という旨のメールを送るだけに留める(create_customer・generate_applicationは使わない)

# generate_applicationツールについて
- 5項目(会社名・ご担当者名・所在地・メールアドレス・会社URL)がすべて揃うまでは使わない
- 生成後は必ず内容の確認を求め、相手が明確に同意するまでcreate_customerには進まない
- 修正があれば、新しい内容で再度このツールを呼び出す(古い内容のまま次に進まない)

# create_customerツールについて
- 明確な導入意思の確認(申込書の内容確認・同意)が済んだ段階でのみ使う。単なる問い合わせ段階では絶対に使わない
- 発行されたID・パスワードは、必ずsend_emailツールで本人に送る(チャット画面上には表示しない)

# send_emailツールについて
- メールアドレスを聞き出せた場合のみ使用できる
- 相手の同意なく勝手に送らない。「内容をまとめてメールでお送りしますね」のように一言伝えてから使う
- 件名・本文は丁寧な日本語のビジネスメール調にする
- 送信後は「送信しました」の確認を待たず、そのまま自然に会話を締めくくって良い

# トーンと制約
- 1回の返信は3〜5文程度に収め、長々と説明しすぎない
- 押し売り感を出さない。相手のペースに合わせる
- 具体的な料金や機能の話は、上記の情報の範囲内で答える。分からないことを聞かれたら「詳細は担当者からご連絡します」と正直に答える
- 会話の早い段階では料金を提示しない。最低限、相手の状況と困りごとが分かってから提示する
- 抽象的・曖昧な質問には、いきなり分からないと返さず、聞き返して意図を掘り下げる
- 世間話や雑談程度の脱線には短く自然に相槌を打って良い。ただし、サービスと全く関係のない話題が続く場合は、冷たく拒否せず「そのあたりは私では詳しくお答えできないので」と一言添えたうえで、自然に本題へ話を戻す
- 連絡先を受け取ったら、丁寧にお礼を言って会話を締めくくる`;

let conversationHistory = [];
let isWaitingForResponse = false;

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const quickRepliesEl = document.getElementById('quickReplies');

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="d"></div><div class="d"></div><div class="d"></div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

function setQuickReplies(options){
  quickRepliesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      quickRepliesEl.innerHTML = '';
      sendMessage(opt);
    });
    quickRepliesEl.appendChild(btn);
  });
}

async function verifyUrlTool(input){

    const res = await fetch("https://chatbot-proxy.netlify.app/.netlify/functions/verify-url", {
      method: "POST",
      headers: { "Content-Type": "application/json" },

  description: "資料請求のメールアドレスが、既に別の会社名で登録されていないかを確認する。upsert_leadを呼ぶ前に必ず使う。",

function downloadDocxFile(base64, filename){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  const byteArray = new Uint8Array(byteNumbers);
  const blob = new Blob([byteArray], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  const url = URL.createObjectURL(blob);

  const wrap = document.createElement('div');
  wrap.style.marginTop = '8px';
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.textContent = '📄 ' + filename + '(クリックしてダウンロード)';
  link.style.color = 'var(--amber)';
  wrap.appendChild(link);
  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

async function generateApplicationTool(input){
  try{
    const res = await fetch("https://chatbot-proxy.netlify.app/.netlify/functions/generate-application", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(input)
    });
    const data = await res.json();
    if(res.ok && data.fileBase64){
      downloadDocxFile(data.fileBase64, data.filename);
      return "申込書を生成し、チャット内にダウンロードリンクを表示しました。";
    }
    return "申込書の生成に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "申込書の生成中にエラーが発生しました: " + e.message;
  }
}

const CREATE_CUSTOMER_TOOL = {
  name: "create_customer",
  description: "クロージング(お客様が導入に前向きな意思を示し、申込書の内容にも同意した)段階で、そのお客様専用の設定用ID・パスワードを発行する。資料請求など未成約の記録にはupsert_leadツールを使い、これは使わない。",
  input_schema: {
    type: "object",
    properties: {
      customerName: { type: "string", description: "会社名" },
      contactPerson: { type: "string", description: "ご担当者名" },
      address: { type: "string", description: "所在地" },
      email: { type: "string", description: "お客様の連絡先メールアドレス(必ず会話の中で確認してから渡すこと)" },
      companyUrl: { type: "string", description: "会社URL" }
    },
    required: ["customerName", "email"]
  }
};

async function createCustomerTool(input){
  try{
    const res = await fetch("https://chatbot-proxy.netlify.app/.netlify/functions/customer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: 'create',
        customerName: input.customerName,
        contactPerson: input.contactPerson,
        address: input.address,
        email: input.email,
        companyUrl: input.companyUrl
      })
    });
    const data = await res.json();
    if(res.ok && data.id){
      return `発行成功。ID: ${data.id} / パスワード: ${data.password} / 設定画面URL: https://the-chatbot.com/zoe-setup.html`;
    }
    return "発行に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "発行中にエラーが発生しました: " + e.message;
  }
}

const EMAIL_TOOL = {
  name: "send_email",
  description: "訪問者にメールを送信する。クロージング時に申し込み案内を送る、相談内容のまとめを送る、担当者への取り次ぎが必要な場合などに使う。訪問者からメールアドレスを聞き出せた場合のみ使用可能。",
  input_schema: {
    type: "object",
    properties: {
      to: { type: "string", description: "送信先メールアドレス" },
      subject: { type: "string", description: "件名" },
      text: { type: "string", description: "本文" }
    },
    required: ["to", "subject", "text"]
  }
};

async function sendEmailTool(input){
  try{
    const res = await fetch("https://chatbot-proxy.netlify.app/.netlify/functions/send-email", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(input)
    });
    const data = await res.json();
    if(res.ok && data.success){
      return "送信成功しました。";
    }
    return "送信に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "送信中にエラーが発生しました: " + e.message;
  }
}

async function callZoe(messages){
  let currentMessages = messages.slice();

  while(true){
    const response = await fetch("https://chatbot-proxy.netlify.app/.netlify/functions/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: currentMessages,
        tools: [EMAIL_TOOL, CREATE_CUSTOMER_TOOL, GENERATE_APPLICATION_TOOL, SEND_BROCHURE_TOOL, VERIFY_URL_TOOL, CHECK_LEAD_EMAIL_TOOL, UPSERT_LEAD_TOOL]
      })
    });
    const data = await response.json();

    const toolUseBlock = data.content.find(b => b.type === 'tool_use');
    if(toolUseBlock){
      let toolResultText;
      if(toolUseBlock.name === 'create_customer'){
        toolResultText = await createCustomerTool(toolUseBlock.input);
      } else if(toolUseBlock.name === 'generate_application'){
        toolResultText = await generateApplicationTool(toolUseBlock.input);
      } else if(toolUseBlock.name === 'send_brochure'){
        toolResultText = await sendBrochureTool();
      } else if(toolUseBlock.name === 'verify_url'){
        toolResultText = await verifyUrlTool(toolUseBlock.input);
      } else if(toolUseBlock.name === 'check_lead_email'){
        toolResultText = await checkLeadEmailTool(toolUseBlock.input);
      } else if(toolUseBlock.name === 'upsert_lead'){
        toolResultText = await upsertLeadTool(toolUseBlock.input);
      } else {
        toolResultText = await sendEmailTool(toolUseBlock.input);
      }
      currentMessages = currentMessages.concat([
        { role: 'assistant', content: data.content },
        { role: 'user', content: [{ type: 'tool_result', tool_use_id: toolUseBlock.id, content: toolResultText }] }
      ]);
      continue; // もう一度Zoeに問い合わせて、最終的な返信テキストを得る
    }

    const textBlock = data.content.find(b => b.type === 'text');
    return { text: textBlock ? textBlock.text : '(応答の取得に失敗しました)', finalMessages: currentMessages };
  }
}

async function sendMessage(text){
  if(!text || isWaitingForResponse) return;
  isWaitingForResponse = true;
  sendBtn.disabled = true;
  quickRepliesEl.innerHTML = '';

  addMessage('user', text);
  conversationHistory.push({role:'user', content: text});
  userInput.value = '';
  autoResize();

  showTyping();
  try{
    const result = await callZoe(conversationHistory);
    hideTyping();
    addMessage('bot', result.text);
    conversationHistory = result.finalMessages.concat([{role:'assistant', content: result.text}]);
  }catch(e){
    hideTyping();
    addMessage('bot', 'すみません、通信エラーが発生しました。もう一度お試しいただくか、フォームからお問い合わせください。');
  }
  isWaitingForResponse = false;
  sendBtn.disabled = false;
}

function autoResize(){
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
}

userInput.addEventListener('input', autoResize);
userInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage(userInput.value.trim());
  }
});
sendBtn.addEventListener('click', () => sendMessage(userInput.value.trim()));

// URLパラメータ(会社名・担当者名・業種・メール・相談内容)を読み取り、入力があればZoeの最初の挨拶に活かす
const urlParams = new URLSearchParams(window.location.search);
const prefillCompany = urlParams.get('company');
const prefillPerson = urlParams.get('person');
const prefillIndustry = urlParams.get('industry');
const prefillEmail = urlParams.get('email');
const prefillMsg = urlParams.get('msg');

async function lookupRecall(company, person){
  try{
    const res = await fetch("https://chatbot-proxy.netlify.app/.netlify/functions/recall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'lookup', company, person })
    });
    const data = await res.json();
    return data.found ? data.record : null;
  }catch(e){
    return null; // 失敗しても通常の初回フローに落とすだけなので握りつぶす
  }
}

async function saveRecall(company, person, firstTopic){
  try{
    await fetch("https://chatbot-proxy.netlify.app/.netlify/functions/recall", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'save', company, person, firstTopic })
    });
  }catch(e){
    // 保存に失敗しても会話自体は継続させる
  }
}

// 事前情報を踏まえたcontextLineを組み立てる(通常の初回向け、または再訪問向けで内容を変える)
function buildContextLine(pastRecord){
  if(pastRecord){
    // 再訪問:以前の最初の相談内容を絡めて、感謝+本人確認を兼ねた挨拶にする
    let line = `事前情報 — 会社名: ${prefillCompany}　ご担当者様名: ${prefillPerson}`;
    if(prefillIndustry) line += `　業種: ${prefillIndustry}`;
    if(prefillEmail) line += `　連絡先: ${prefillEmail}`;
    if(prefillMsg) line += `　今回のご相談内容: ${prefillMsg}`;
    line += `\n\nこの方は以前にもお問い合わせいただいたことがあり、前回最初にご相談いただいた件は「${pastRecord.firstTopic}」でした。`;
    line += `\n\n上記を踏まえて、「(会社名)の(お名前)様、いつもご連絡ありがとうございます。本日は、どうされましたか?前回お問い合わせ頂きましたのは、(前回の件)でしたよね?」という形式で、感謝の挨拶と前回内容の確認を続けて自然に述べてください。`;
    return line;
  }
  let contextLine = '事前情報 — ';
  if(prefillCompany) contextLine += `会社名: ${prefillCompany}　`;
  if(prefillPerson) contextLine += `ご担当者様名: ${prefillPerson}　`;
  if(prefillIndustry) contextLine += `業種: ${prefillIndustry}　`;
  if(prefillEmail) contextLine += `連絡先: ${prefillEmail}　`;
  if(prefillMsg) contextLine += `相談内容: ${prefillMsg}`;
  contextLine += '\n\n上記の情報を踏まえて、挨拶と最初の質問をしてください。会社名とご担当者様名が分かる場合は「(会社名)の(お名前)様」のように呼びかけてください。';
  return contextLine;
}

// Opening message
(async () => {
  const hasPrefill = prefillCompany || prefillPerson || prefillIndustry || prefillEmail || prefillMsg;
  let pastRecord = null;

  // 会社名+お名前の両方が揃っている場合のみ、過去の会話を照会する(名前だけの人は記憶対象外)
  if(prefillCompany && prefillPerson){
    pastRecord = await lookupRecall(prefillCompany, prefillPerson);
    // 初めての組み合わせなら、今回の相談内容を「最初の件」として新規保存しておく
    if(!pastRecord){
      saveRecall(prefillCompany, prefillPerson, prefillMsg || prefillIndustry || 'ご相談');
    }
  }

  if(hasPrefill){
    conversationHistory.push({role:'user', content: buildContextLine(pastRecord)});
    showTyping();
    try{
      const result = await callZoe(conversationHistory);
      hideTyping();
      addMessage('bot', result.text);
      conversationHistory = result.finalMessages.concat([{role:'assistant', content: result.text}]);
    }catch(e){
      hideTyping();
      addMessage('bot', 'こんにちは、Zoeです。御社の業務について、簡単にお話を伺えればと思います。まず、どんなお仕事をされてますか?');
      setQuickReplies(['美容・サロン系', '製造・卸・物販系', 'その他の業種']);
    }
  } else {
    addMessage('bot', 'こんにちは、Zoeです。御社の業務について、簡単にお話を伺えればと思います。まず、どんなお仕事をされてますか?');
    setQuickReplies(['美容・サロン系', '製造・卸・物販系', 'その他の業種']);
  }
})();
