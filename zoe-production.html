<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャット</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#10131a;
    --panel:#1a1f2a;
    --panel-2:#212836;
    --line:#2c3444;
    --text:#e6e9ef;
    --text-dim:#8a93a6;
    --accent:#4d9cff;
    --accent-hot:#2f6fe0;
    --accent-dim:rgba(77,156,255,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    height:100vh; display:flex; flex-direction:column;
  }
  header{ padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .avatar{ width:36px;height:36px;border-radius:9px; background:linear-gradient(135deg, var(--accent), var(--accent-hot)); display:flex;align-items:center;justify-content:center; font-weight:700;color:#fff;font-size:14px; }
  .header-name{ font-weight:700; font-size:14px; }
  #chatArea{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; max-width:720px; width:100%; margin:0 auto; }
  .msg{ max-width:82%; padding:11px 14px; border-radius:14px; font-size:14px; line-height:1.65; white-space:pre-wrap; }
  .msg.bot{ background:var(--panel); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.user{ background:var(--accent-dim); border:1px solid var(--accent); align-self:flex-end; border-bottom-right-radius:4px; }
  .msg.typing{ background:var(--panel); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; display:flex; gap:4px; padding:14px 16px; }
  .typing .d{ width:6px;height:6px;border-radius:50%; background:var(--text-dim); animation:bounce 1.2s infinite ease-in-out; }
  .typing .d:nth-child(2){ animation-delay:0.15s; }
  .typing .d:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}
  #inputArea{ display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line); flex-shrink:0; max-width:720px; width:100%; margin:0 auto; box-sizing:border-box; }
  #userInput{ flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:12px 14px; border-radius:10px; font-family:'Inter',sans-serif; font-size:14.5px; outline:none; resize:none; }
  #userInput:focus{ border-color:var(--accent); }
  #sendBtn{ background:linear-gradient(135deg, var(--accent), var(--accent-hot)); color:#fff; border:none; border-radius:10px; padding:0 20px; font-weight:700; font-size:14px; cursor:pointer; touch-action:manipulation; flex-shrink:0; }
  #sendBtn:disabled{ opacity:0.5; }
</style>
</head>
<body>

<header>
  <div class="avatar" id="avatarLetter">Z</div>
  <div class="header-name" id="headerName">Zoe</div>
</header>
<div id="chatArea"></div>
<div id="inputArea">
  <textarea id="userInput" rows="1" placeholder="メッセージを入力..."></textarea>
  <button id="sendBtn">送信</button>
</div>

<script>
const CUSTOMER_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/customer";
const CHAT_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/chat";
const TRACK_ENDPOINT = "https://chatbot-proxy.netlify.app/.netlify/functions/track-event";

const customerId = new URLSearchParams(window.location.search).get('id');
let conversationHistory = [];
let isWaitingForResponse = false;
let sessionAdminPassword = null;
let awaitingAdminPassword = false;

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

const TEXT_COLOR_MAP = { black: '#1a1a1a', blue: '#2f6fe0', yellow: '#c99a00', red: '#d23c3c', orange: '#e08a2e', green: '#2f9e52' };

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}
function showTyping(){
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="d"></div><div class="d"></div><div class="d"></div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}
function autoResize(){
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
}

async function callZoe(messages){
  const response = await fetch(CHAT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      mode: "zoe-production",
      id: customerId,
      adminPassword: sessionAdminPassword,
      messages
    })
  });
  const data = await response.json();
  if(data.error){
    throw new Error(data.error);
  }
  const textBlock = (data.content || []).find(b => b.type === 'text');
  return textBlock ? textBlock.text : '(応答の取得に失敗しました)';
}

async function sendMessage(text){
  if(!text || isWaitingForResponse) return;

  if(awaitingAdminPassword){
    sessionAdminPassword = text.trim();
    awaitingAdminPassword = false;
    addMessage('user', text);
    addMessage('bot', '承知しました。');
    userInput.value = '';
    autoResize();
    return;
  }
  if(/^admin/i.test(text.trim())){
    addMessage('user', text);
    addMessage('bot', 'パスワードを入力してください。');
    awaitingAdminPassword = true;
    userInput.value = '';
    autoResize();
    return;
  }

  isWaitingForResponse = true;
  sendBtn.disabled = true;
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  userInput.value = '';
  autoResize();

  showTyping();
  try{
    const reply = await callZoe(conversationHistory);
    hideTyping();
    addMessage('bot', reply);
    conversationHistory.push({ role: 'assistant', content: reply });
  }catch(e){
    hideTyping();
    addMessage('bot', 'すみません、通信エラーが発生しました。もう一度お試しください。');
  }
  isWaitingForResponse = false;
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', () => sendMessage(userInput.value.trim()));
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
userInput.addEventListener('input', autoResize);
userInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    if(isTouchDevice) return;
    e.preventDefault();
    sendMessage(userInput.value.trim());
  }
});

(async () => {
  if(!customerId){
    addMessage('bot', 'チャットの読み込みに失敗しました(IDが指定されていません)。');
    return;
  }

  // アクセス統計:このチャット画面が開かれるたびに1回記録する(失敗しても会話には影響させない)
  fetch(TRACK_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type: "chat_start", botId: customerId })
  }).catch(() => {});

  try{
    const res = await fetch(CUSTOMER_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'check', id: customerId })
    });
    const data = await res.json();
    if(!res.ok){
      addMessage('bot', 'チャットの読み込みに失敗しました。');
      return;
    }
    if(data.chatDisplayName){
      document.getElementById('headerName').textContent = data.chatDisplayName;
      document.getElementById('avatarLetter').textContent = data.chatDisplayName.charAt(0).toUpperCase();
      document.title = data.chatDisplayName;
    }
    if(data.chatTheme){
      const bg = data.chatTheme.bgColor === 'white' ? '#ffffff' : '#10131a';
      const panelBg = data.chatTheme.bgColor === 'white' ? '#f2f2f2' : '#1a1f2a';
      const textColor = data.chatTheme.bgColor === 'white' ? '#1a1a1a' : '#e6e9ef';
      const accent = TEXT_COLOR_MAP[data.chatTheme.textColor] || '#4d9cff';
      document.documentElement.style.setProperty('--bg', bg);
      document.documentElement.style.setProperty('--panel', panelBg);
      document.documentElement.style.setProperty('--panel-2', panelBg);
      document.documentElement.style.setProperty('--text', textColor);
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--accent-hot', accent);
    }
  }catch(e){
    // ブランディング取得に失敗しても、初期設定のまま会話は続行する
  }

  addMessage('bot', 'こんにちは!ご質問があればお気軽にどうぞ。');
})();
</script>
</body>
</html>
