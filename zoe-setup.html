<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Console | the.chatBOT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#10131a;
    --panel:#1a1f2a;
    --panel-2:#212836;
    --line:#2c3444;
    --text:#e6e9ef;
    --text-dim:#8a93a6;
    --accent:#4d9cff;
    --accent-hot:#2f6fe0;
    --accent-dim:rgba(77,156,255,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ログイン画面 */
  #loginScreen{
    flex:1;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-box{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:32px 26px;max-width:360px;width:100%;
  }
  .login-box h1{font-family:'Shippori Mincho',serif;font-size:20px;margin:0 0 6px;}
  .login-box .sub{font-size:13px;color:var(--text-dim);margin-bottom:22px;line-height:1.6;}
  .login-box input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:9px;font-size:15px;margin-bottom:12px;outline:none;
  }
  .login-box input:focus{border-color:var(--accent);}
  .login-box button{
    width:100%;background:linear-gradient(135deg, var(--accent), var(--accent-hot));
    color:#fff;border:none;border-radius:9px;padding:13px;font-weight:700;font-size:14.5px;
    cursor:pointer;touch-action:manipulation;
  }
  .login-error{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:18px;}

  /* チャット画面 */
  #chatScreen{display:none;flex:1;flex-direction:column;overflow:hidden;}
  header{
    padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .header-left{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:36px;height:36px;border-radius:9px;
    background:linear-gradient(135deg, var(--accent), var(--accent-hot));
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;font-weight:700;color:#fff;font-size:14px;
  }
  .header-name{font-weight:700;font-size:14px;}
  .header-sub{font-size:11px;color:var(--text-dim);}
  .status-badge{
    font-size:11px;padding:4px 10px;border-radius:20px;background:var(--accent-dim);
    color:var(--accent);border:1px solid var(--accent);
  }

  #chatArea{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;max-width:720px;width:100%;margin:0 auto;}
  .msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;}
  .msg.bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:var(--accent-dim);border:1px solid var(--accent);align-self:flex-end;border-bottom-right-radius:4px;}
  .msg.typing{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;display:flex;gap:4px;padding:14px 16px;}
  .typing .d{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:bounce 1.2s infinite ease-in-out;}
  .typing .d:nth-child(2){animation-delay:0.15s;}
  .typing .d:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}

  #inputArea{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);flex-shrink:0;max-width:720px;width:100%;margin:0 auto;box-sizing:border-box;flex-direction:column;}
  #inputRow{display:flex;gap:10px;}
  #attachBtn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
    border-radius:10px;padding:0 16px;font-size:18px;cursor:pointer;flex-shrink:0;touch-action:manipulation;
  }
  #filePreview{
    display:none;flex-wrap:wrap;gap:6px;margin-bottom:8px;
  }
  .file-chip{
    display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--accent);
    border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--text-dim);max-width:220px;
  }
  .file-chip .name{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-chip .remove{cursor:pointer;color:#ff6b6b;font-weight:700;padding:0 2px;flex-shrink:0;}
  #inputArea.drag-over{outline:2px dashed var(--accent);outline-offset:-4px;background:rgba(74,144,226,0.06);}
  #userInput{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font-family:'Inter',sans-serif;font-size:14.5px;outline:none;resize:none;}
  #userInput:focus{border-color:var(--accent);}
  #sendBtn{background:linear-gradient(135deg, var(--accent), var(--accent-hot));color:#fff;border:none;border-radius:10px;padding:0 20px;font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation;flex-shrink:0;}
  #sendBtn:disabled{opacity:0.5;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>DNA Console</h1>
    <div class="sub">発行されたIDとパスワードでログインしてください。ここでZoeに御社の情報を教えると、本番用のFAQを一緒に育てられます。</div>
    <input id="loginId" placeholder="ID(6桁)">
    <input id="loginPw" placeholder="パスワード">
    <button id="loginBtn">ログイン</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="chatScreen">
  <header>
    <div class="header-left">
      <div class="avatar">Z</div>
      <div>
        <div class="header-name" id="headerName">DNA Console</div>
        <div class="header-sub" id="headerId"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="tokenUsageBar" style="display:none;align-items:center;gap:6px;" title="今月のご利用量">
        <div style="width:70px;height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;">
          <div id="tokenUsageFill" style="height:100%;width:0%;background:#4a90e2;transition:width 0.3s;"></div>
        </div>
        <span id="tokenUsagePercent" style="font-size:11px;color:var(--text-dim);"></span>
      </div>
      <div class="status-badge" id="statusBadge">setup</div>
    </div>
  </header>
  <div id="chatNameBar" style="display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:6px 18px;border-bottom:1px solid var(--line);">
    <a href="https://the-chatbot.com/zoe-setup-manual.docx" target="_blank" style="color:var(--text-dim);font-size:12.5px;text-decoration:none;">取扱説明書</a>
    <a href="https://the-chatbot.com/stage-flw.html" target="_blank" style="color:var(--text-dim);font-size:12.5px;text-decoration:none;">flow</a>
    <button id="chatNameChangeBtn" style="background:none;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;padding:4px 6px;">チャット名変更</button>
  </div>
  <div id="chatArea"></div>
  <div id="inputArea">
    <div id="filePreview"></div>
    <div id="inputRow">
      <button id="attachBtn" title="画像・PDF・テキスト等を添付(複数選択・ドラッグ&amp;ドロップ可)">📎</button>
      <input type="file" id="fileInput" accept=".pdf,image/*,.txt,.csv,.docx,.xlsx" multiple style="display:none;">
      <textarea id="userInput" rows="1" placeholder="メッセージを入力..."></textarea>
      <button id="sendBtn">送信</button>
    </div>
  </div>
  <div id="stageButtonBar" style="display:none;gap:8px;padding:10px 18px 14px;">
    <button id="stage1Btn" style="flex:1;border:none;border-radius:9px;padding:10px 8px;font-weight:700;font-size:13px;cursor:pointer;">ステージ1</button>
    <button id="stage2Btn" style="display:none;flex:1;border:none;border-radius:9px;padding:10px 8px;font-weight:700;font-size:13px;cursor:pointer;">ステージ2</button>
    <button id="publishBtn" style="display:none;flex:1;border:none;border-radius:9px;padding:10px 8px;font-weight:700;font-size:13px;cursor:pointer;background:#ffb020;color:#fff;">公開</button>
    <button id="specBtn" style="display:none;flex:1;border:none;border-radius:9px;padding:10px 8px;font-weight:700;font-size:13px;cursor:pointer;position:relative;">現在の仕様<span id="specQueueBadge" style="display:none;position:absolute;top:-8px;right:-6px;background:var(--panel);color:#ff5c5c;font-size:11px;font-weight:800;padding:1px 6px;border-radius:10px;border:1px solid #ff5c5c;"></span></button>
  </div>
</div>

<script>
const CHAT_ENDPOINT = "https://thechatbot-proxy.vercel.app/api/chat";
const CUSTOMER_ENDPOINT = "https://thechatbot-proxy.vercel.app/api/customer";

let currentCustomer = null; // {id, password, customerName, status, systemPrompt, faqDraft}
let isAdminSession = false; // admin(運営)としてログインした場合はtrue。この間はお客様の進捗記録を一切保存しない
const urlAdminPassword = new URLSearchParams(window.location.search).get('admin') || null;
let conversationHistory = [];
let isWaitingForResponse = false;

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

async function sendEmailTool(input){
  try{
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/send-email", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(input)
    });
    const data = await res.json();
    if(res.ok && data.success){ return "送信成功しました。"; }
    return "送信に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "送信中にエラーが発生しました: " + e.message;
  }
}

async function sendQuestionsFileTool(input){
  if(testMode){
    // テストモード中は実際にメール送信せず、チャット上に内容を表示してダウンロードできるようにする
    const lines = [input.title || '確認事項リスト', ''];
    (input.questions || []).forEach((q, i) => lines.push(`${i + 1}. ${q}`));
    const textContent = lines.join('\n');

    const div = document.createElement('div');
    div.className = 'msg bot';
    const pre = document.createElement('div');
    pre.style.cssText = 'white-space:pre-wrap;font-size:13px;';
    pre.textContent = '[テスト: 実際には送信していません]\n\n' + textContent;
    div.appendChild(pre);
    div.appendChild(downloadTextFile('questions.txt', textContent));
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;

    return `テスト表示成功(${(input.questions || []).length}件。実際の送信はしていません)`;
  }

  try{
    const res = await fetch("https://thechatbot-proxy.vercel.app/api/send-questions-pdf", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(input)
    });
    const data = await res.json();
    if(res.ok && data.success){
      return `送信成功(${data.count}件の確認事項を送付しました)`;
    }
    return "送信に失敗しました: " + (data.error || "不明なエラー");
  }catch(e){
    return "送信中にエラーが発生しました: " + e.message;
  }
}

async function callZoe(messages){
  let currentMessages = messages.slice();

  while(true){
    const response = await fetch(CHAT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "zoe-setup",
        id: currentCustomer.id,
        adminPassword: urlAdminPassword,
        customerName: currentCustomer.customerName,
        email: currentCustomer.email,
        stage1Complete: !!currentCustomer.stage1Complete,
        stage2Active: !!currentCustomer.stage2Active,
        stage2Complete: !!currentCustomer.stage2Complete,
        published: !!currentCustomer.published,
        messages: currentMessages
      })
    });
    const data = await response.json();
    if(data.error){
      throw new Error('APIエラー(status ' + response.status + '): ' + JSON.stringify(data.error));
    }

    const toolUseBlocks = (data.content || []).filter(b => b.type === 'tool_use');
    if(toolUseBlocks.length > 0){
      const toolResultBlocks = [];
      for(const block of toolUseBlocks){
        let toolResultText;
        if(block.name === 'get_current_status'){
          toolResultText = await getCurrentStatusTool();
        } else if(block.name === 'send_email'){
          toolResultText = await sendEmailTool(block.input);
        } else if(block.name === 'send_questions_file'){
          toolResultText = await sendQuestionsFileTool(block.input);
        } else if(block.name === 'complete_stage1'){
          toolResultText = await completeStage1Tool();
        } else if(block.name === 'start_stage2'){
          toolResultText = await startStage2Tool();
        } else if(block.name === 'pause_stage2'){
          toolResultText = await pauseStage2Tool();
        } else if(block.name === 'complete_stage2'){
          toolResultText = await completeStage2Tool();
        } else if(block.name === 'publish'){
          toolResultText = await publishTool(block.input);
        } else if(block.name === 'export_faq'){
          toolResultText = await exportFaqTool(block.input);
        } else if(block.name === 'update_chat_display'){
          toolResultText = await applyChatDisplayChange(block.input.displayName, block.input.bgColor, block.input.textColor);
        } else if(block.name === 'issue_my_admin_password'){
          toolResultText = await issueMyAdminPasswordTool();
        } else {
          toolResultText = "不明なツールです";
        }
        toolResultBlocks.push({ type: 'tool_result', tool_use_id: block.id, content: toolResultText });
      }
      currentMessages = currentMessages.concat([
        { role: 'assistant', content: data.content },
        { role: 'user', content: toolResultBlocks }
      ]);
      continue;
    }

    const textBlock = data.content.find(b => b.type === 'text');
    return { text: textBlock ? textBlock.text : '(応答の取得に失敗しました)', finalMessages: currentMessages };
  }
}

function addMessage(role, text, imageDataUrl){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if(imageDataUrl){
    const img = document.createElement('img');
    img.src = imageDataUrl;
    img.style.cssText = 'max-width:100%;max-height:220px;border-radius:8px;display:block;margin-bottom:6px;';
    div.appendChild(img);
  }
  const textNode = document.createElement('div');
  textNode.textContent = text;
  div.appendChild(textNode);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="d"></div><div class="d"></div><div class="d"></div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

async function updateCustomerRecord(updates){
  try{
    await fetch(CUSTOMER_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: 'update',
        id: currentCustomer.id,
        password: currentCustomer.password,
        updates
      })
    });
    Object.assign(currentCustomer, updates);
    return true;
  }catch(e){
    return false;
  }
}

// 今月のトークン使用量を取得し、ヘッダーのインジケーターに反映する。
// 50%までブルー・75%までイエロー・75%超はレッド。
async function loadTokenUsage(){
  if(!currentCustomer || !currentCustomer.id) return;
  try{
    const res = await fetch(CUSTOMER_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'getTokenUsage', id: currentCustomer.id, password: currentCustomer.password })
    });
    if(!res.ok) return;
    const data = await res.json();
    const bar = document.getElementById('tokenUsageBar');
    const fill = document.getElementById('tokenUsageFill');
    const label = document.getElementById('tokenUsagePercent');
    if(!bar || !fill || !label) return;

    const percent = Math.min(data.percent, 100);
    let color = '#4a90e2'; // ブルー(50%まで)
    if(percent > 75){ color = '#e24a4a'; } // レッド
    else if(percent > 50){ color = '#e2b34a'; } // イエロー

    fill.style.width = percent + '%';
    fill.style.background = color;
    label.textContent = percent + '%';
    bar.style.display = 'flex';
  }catch(e){
    // 取得に失敗しても、チャット自体の動作には影響させない
  }
}

function renderStageButtons(){
  const bar = document.getElementById('stageButtonBar');
  const s1 = document.getElementById('stage1Btn');
  const s2 = document.getElementById('stage2Btn');
  const pub = document.getElementById('publishBtn');
  const spec = document.getElementById('specBtn');
  bar.style.display = 'flex';

  if(currentCustomer.stage1Complete){
    // 完了後は小さい四角(✓)にして左に寄せ、他のボタンを目立たせる
    s1.style.background = '#4d9cff';
    s1.style.color = '#fff';
    s1.style.flex = '0 0 40px';
    s1.style.fontSize = '16px';
    s1.textContent = '✓';
    s1.disabled = true;
    s2.style.display = 'block';
    pub.style.display = 'block';
    spec.style.display = 'block';
  } else {
    s1.style.background = '#ffb020';
    s1.style.color = '#fff';
    s1.style.flex = '1';
    s1.style.fontSize = '13px';
    s1.textContent = 'ステージ1';
    s1.disabled = false;
    s2.style.display = 'none';
    pub.style.display = 'none';
    spec.style.display = 'none';
  }

  if(currentCustomer.stage2Complete){
    s2.style.background = '#4d9cff';
    s2.style.color = '#fff';
    s2.textContent = 'ステージ2';
  } else if(currentCustomer.stage2Active){
    s2.style.background = '#ffb020';
    s2.style.color = '#fff';
    s2.textContent = 'ステージ2(中断)';
  } else {
    s2.style.background = '#ffb020';
    s2.style.color = '#fff';
    s2.textContent = 'ステージ2';
  }

  renderSpecButton();
}

function renderSpecButton(){
  const spec = document.getElementById('specBtn');
  const badge = document.getElementById('specQueueBadge');
  const status = currentCustomer.specStatus || 'idle';
  if(status === 'updating'){
    spec.style.background = '#ffb020';
    spec.style.color = '#fff';
    const count = currentCustomer.specQueueCount || 0;
    if(count > 0){
      badge.style.display = 'block';
      badge.textContent = String(count);
    } else {
      badge.style.display = 'none';
    }
  } else {
    spec.style.background = '#4d9cff';
    spec.style.color = '#fff';
    badge.style.display = 'none';
  }
}

// 現在の仕様の状態(updating/idle、待ち件数)を定期的に確認する。
// 生成自体はバックグラウンド(update-spec.js)で行われるため、ここでは状態を見に行くだけ
async function pollSpecStatus(){
  if(!currentCustomer || !currentCustomer.id) return;
  try{
    const res = await fetch(CUSTOMER_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'check', id: currentCustomer.id })
    });
    if(res.ok){
      const data = await res.json();
      currentCustomer.specStatus = data.specStatus;
      currentCustomer.specQueueCount = data.specQueueCount;
      if(currentCustomer.stage1Complete) renderSpecButton();
    }
  }catch(e){ /* ポーリング失敗は無視して次回に任せる */ }
}
setInterval(pollSpecStatus, 30000);

document.getElementById('stage1Btn').addEventListener('click', () => {
  if(currentCustomer.stage1Complete) return;
  sendMessage('ステージ1を完了できるか確認してください');
});
document.getElementById('stage2Btn').addEventListener('click', () => {
  if(currentCustomer.stage2Complete) return;
  sendMessage(currentCustomer.stage2Active ? 'ステージ2を中断してください' : 'ステージ2を始めたいです');
});
document.getElementById('publishBtn').addEventListener('click', () => {
  sendMessage('公開したいです');
});
document.getElementById('specBtn').addEventListener('click', async () => {
  try{
    const res = await fetch(CUSTOMER_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: 'getSpecDoc', id: currentCustomer.id, password: currentCustomer.password })
    });
    const data = await res.json();
    if(!res.ok){
      alert('取得に失敗しました: ' + (data.error || '不明なエラー'));
      return;
    }
    currentCustomer.specStatus = data.specStatus;
    currentCustomer.specQueueCount = data.specQueueCount;
    renderSpecButton();
    if(!data.specDocBase64){
      alert('まだ資料が生成されていません。しばらく経ってからもう一度お試しください。');
      return;
    }
    const filename = data.specDocFilename || '現在の仕様.docx';
    const byteChars = atob(data.specDocBase64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }catch(e){
    alert('通信エラーが発生しました: ' + e.message);
  }
});

async function completeStage1Tool(){
  const ok = await updateCustomerRecord({ stage1Complete: true });
  renderStageButtons();
  return ok ? "ステージ1を完了として記録しました。" : "記録に失敗しました。";
}
async function startStage2Tool(){
  const ok = await updateCustomerRecord({ stage2Active: true });
  renderStageButtons();
  return ok ? "ステージ2を開始として記録しました。" : "記録に失敗しました。";
}
async function pauseStage2Tool(){
  const ok = await updateCustomerRecord({ stage2Active: false });
  renderStageButtons();

async function saveProgress(){
  // これまでの会話をfaqDraftとしてそのまま保存しておく(簡易版:あとで整形して使う想定)
  const faqDraft = conversationHistory.map(m => {
    const speaker = m.role === 'user' ? 'お客様' : 'Zoe';
    let content = '';
    if(typeof m.content === 'string'){
      content = m.content;
    } else if(Array.isArray(m.content)){
      const textBlock = m.content.find(b => b.type === 'text');
      const fileBlock = m.content.find(b => b.type === 'image' || b.type === 'document');
      content = (fileBlock ? '[添付ファイルあり] ' : '') + (textBlock ? textBlock.text : '');
    }
    return `${speaker}: ${content}`;
  }).join('\n');

  // 次回ログイン時に会話を再開できるよう、添付ファイルの中身(base64)は
  // 軽いプレースホルダーに置き換えた上で、会話履歴そのものも保存しておく
  const sanitizedHistory = conversationHistory.map(m => {
    if(Array.isArray(m.content)){
      return {
        role: m.role,
        content: m.content.map(b => (b.type === 'image' || b.type === 'document')
          ? { type: 'text', text: '[以前添付されたファイル(内容は保存されていません)]' }
          : b)
      };
    }
    return m;
  });

  try{
    await fetch(CUSTOMER_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: 'update',
        id: currentCustomer.id,
        password: currentCustomer.password,
        updates: { faqDraft, setupConversationHistory: JSON.stringify(sanitizedHistory), lastMessageAt: new Date().toISOString() }
      })
    });
  }catch(e){
    // 保存に失敗しても会話は続行する
  }
}

let attachedFiles = []; // [{ name, mediaType, base64, kind: 'image'|'document'|'text', text? }]
let testMode = false; // trueの間はsend_questions_fileが実際に送信せず、チャットに表示+ダウンロードに切り替わる

function renderFilePreview(){
  const box = document.getElementById('filePreview');
  box.innerHTML = '';
  if(attachedFiles.length === 0){
    box.style.display = 'none';
    return;
  }
  box.style.display = 'flex';
  attachedFiles.forEach((f, idx) => {
    const chip = document.createElement('span');
    chip.className = 'file-chip';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = f.name;
    const removeSpan = document.createElement('span');
    removeSpan.className = 'remove';
    removeSpan.textContent = '×';
    removeSpan.addEventListener('click', () => {
      attachedFiles.splice(idx, 1);
      renderFilePreview();
    });
    chip.appendChild(nameSpan);
    chip.appendChild(removeSpan);
    box.appendChild(chip);
  });
}

function downloadDocxFile(base64, filename){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  const byteArray = new Uint8Array(byteNumbers);
  const blob = new Blob([byteArray], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  const url = URL.createObjectURL(blob);

  const wrap = document.createElement('div');
  wrap.style.marginTop = '8px';
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.textContent = '📄 ' + filename + '(クリックしてダウンロード)';
  link.style.color = 'var(--accent)';
  wrap.appendChild(link);
  return wrap;
}

function downloadTextFile(filename, content){
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.textContent = '📄 ' + filename + ' をダウンロード';
  a.style.cssText = 'display:inline-block;margin-top:8px;color:var(--accent);text-decoration:underline;font-size:13px;';
  return a;
}

async function sendMessage(text){
  if((!text && attachedFiles.length === 0) || isWaitingForResponse) return;

  isWaitingForResponse = true;
  sendBtn.disabled = true;

  const fileNames = attachedFiles.map(f => `📎 ${f.name}`).join(' ');
  const displayText = text || fileNames;
  const firstImage = attachedFiles.find(f => f.kind === 'image');
  const thumbUrl = firstImage ? `data:${firstImage.mediaType};base64,${firstImage.base64}` : null;
  addMessage('user', displayText, thumbUrl);

  if(attachedFiles.length > 0){
    const contentBlocks = [];
    attachedFiles.forEach(f => {
      if(f.kind === 'text'){
        contentBlocks.push({ type: 'text', text: `[添付ファイル: ${f.name}]\n${f.text}` });
      } else {
        contentBlocks.push({
          type: f.kind,
          source: { type: 'base64', media_type: f.mediaType, data: f.base64 }
        });
      }
    });
    contentBlocks.push({ type: 'text', text: text || 'このファイルの内容を確認してください。' });
    conversationHistory.push({role:'user', content: contentBlocks});
  } else {
    conversationHistory.push({role:'user', content: text});
  }

  userInput.value = '';
  clearAttachedFiles();
  autoResize();

  showTyping();
  try{
    const result = await callZoe(conversationHistory);
    hideTyping();
    addMessage('bot', result.text);
    // 添付ファイル(画像・PDF)の中身は、一度Zoeに見せたら以降の会話履歴には
    // 残さない(プレースホルダーに置き換える)。そうしないと、その後の
    // やり取り全てで同じファイルの中身を毎回送り直すことになり、
    // セッションが長くなるほどAPIコストが雪だるま式に膨らんでしまうため
    const strippedMessages = result.finalMessages.map(m => {
      if(Array.isArray(m.content)){
        return {
          role: m.role,
          content: m.content.map(b => (b.type === 'image' || b.type === 'document')
            ? { type: 'text', text: '[以前添付されたファイル(内容は展開済み。以降の会話には残していません)]' }
            : b)
        };
      }
      return m;
    });
    conversationHistory = strippedMessages.concat([{role:'assistant', content: result.text}]);
    saveProgress();
  }catch(e){
    hideTyping();
    addMessage('bot', 'すみません、通信エラーが発生しました。もう一度お試しください。');
  }
  isWaitingForResponse = false;
  sendBtn.disabled = false;
}

function clearAttachedFiles(){
  attachedFiles = [];
  renderFilePreview();
  document.getElementById('fileInput').value = '';
}

function addFilesFromList(fileList){
  const files = Array.from(fileList);
  for(const file of files){
    const isPdf = file.type === 'application/pdf';
    const isImage = file.type.startsWith('image/');
    const isText = file.type === 'text/plain' || file.type === 'text/csv' || /\.(txt|csv)$/i.test(file.name);
    const isOffice = /\.(docx|xlsx)$/i.test(file.name);

    if(!isPdf && !isImage && !isText && !isOffice){
      alert(`${file.name}: 対応していない形式です(画像・PDF・テキスト・Word・Excelのみ)`);
      continue;
    }
    if(file.size > 10 * 1024 * 1024){
      alert(`${file.name}: ファイルサイズが大きすぎます(10MBまで)`);
      continue;
    }

    if(isText){
      const reader = new FileReader();
      reader.onload = () => {
        attachedFiles.push({ name: file.name, kind: 'text', text: reader.result });
        renderFilePreview();
      };
      reader.readAsText(file);
    } else {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        attachedFiles.push({
          name: file.name,
          mediaType: file.type || 'application/octet-stream',
          base64: base64,
          kind: isImage ? 'image' : 'document'
        });
        renderFilePreview();
      };
      reader.readAsDataURL(file);
    }
  }
}

document.getElementById('fileInput').addEventListener('change', (e) => {

// ブラウザ既定では、入力欄の外でファイルをドロップするとページごと開こうとしてしまうため、
// 入力欄の外側だけ既定動作を止めておく(入力欄自体のドロップ処理を邪魔しないように)
['dragenter','dragover','drop'].forEach(evt => {

const inputAreaEl = document.getElementById('inputArea');
['dragenter','dragover'].forEach(evt => {

  });
});
['dragleave','drop'].forEach(evt => {

    inputAreaEl.classList.remove('drag-over');
  });
});
inputAreaEl.addEventListener('drop', (e) => {
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0){
    addFilesFromList(e.dataTransfer.files);
  }
});

function autoResize(){
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
}
userInput.addEventListener('input', autoResize);
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// isComposingだけだと、環境によってEnterのタイミングで正しく取得できない場合があるため、
// 変換の開始・終了を自前のフラグで管理する
let isComposingIME = false;
userInput.addEventListener('compositionstart', () => { isComposingIME = true; });
userInput.addEventListener('compositionend', () => {
  // compositionendとEnterのkeydownがほぼ同時に来る環境があるため、1フレーム遅らせて解除する
  setTimeout(() => { isComposingIME = false; }, 0);
});

userInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    if(isComposingIME || e.isComposing || e.keyCode === 229){
      return; // IME変換確定のEnterは送信扱いにしない
    }
    if(isTouchDevice){
      return; // スマホ等では、Enterは改行のみ。送信は送信ボタンで行う
    }
    e.preventDefault();
    sendMessage(userInput.value.trim());
  }
});
sendBtn.addEventListener('click', () => sendMessage(userInput.value.trim()));

        hideTyping();
        addMessage('bot', result.text);
      }catch(e){
        hideTyping();
        addMessage('bot', '[デバッグ] 進捗の振り返りでエラー: ' + e.message);
      }
    } else {
      showTyping();
      try{
        const result = await callZoe([{ role: 'user', content: '(これはお客様には見えないシステムメッセージです。初回の挨拶をお願いします)' }]);
        hideTyping();
        addMessage('bot', result.text);
        conversationHistory = result.finalMessages.concat([{ role: 'assistant', content: result.text }]);
      }catch(e){
        hideTyping();
        addMessage('bot', '[デバッグ] 初回挨拶でエラー: ' + e.message);
      }
    }
  }catch(e){
    errorEl.textContent = '通信エラーが発生しました';
  }
});
